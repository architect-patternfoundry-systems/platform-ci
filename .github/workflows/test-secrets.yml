name: Test Secrets
on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
      mutate_manifest:
        type: boolean
        required: false
        default: false
    secrets:
      INTERNAL_PYPI_URL:
        required: true
    outputs:
      test_output:
        value: ${{ jobs.test.outputs.result }}
jobs:
  test:
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      result: ${{ steps.echo.outputs.result }}
    steps:
      - id: echo
        run: |
          echo "result=ok" >> $GITHUB_OUTPUT
          echo "image: ${{ inputs.image_name }}"
          echo "secret length: $(echo -n '${{ secrets.INTERNAL_PYPI_URL }}' | wc -c)"
  test-write:
    runs-on: self-hosted
    needs: test
    if: ${{ inputs.mutate_manifest }}
    permissions:
      contents: write
    steps:
      - run: echo "write job would run here"
