name: Test Write Permission
on:
  workflow_call:
    secrets:
      INTERNAL_PYPI_URL:
        required: true
jobs:
  read-job:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - run: echo "read job"
  write-job:
    runs-on: self-hosted
    needs: read-job
    permissions:
      contents: write
    steps:
      - run: echo "write job"
